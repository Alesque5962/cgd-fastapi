name: CI/CD Pipeline cgd-backend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "/**"
      - ".github/workflows/dagger.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "/**"

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: "pip"

      - name: Install Dagger SDK and CLI
        run: |
          curl -L https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.19.0 sh
          sudo mv bin/dagger /usr/local/bin
          pip install dagger-io>=0.19.0

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Test and publish backend
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python .dagger/src/cgd_backend/ci.py

name: CI/CD Pipeline cgd-backend

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and publish Docker image
        uses: dagger/dagger-for-github@v8.2.0
        with:
          call: docker-build-publish --docker_username=${{ secrets.DOCKERHUB_USERNAME }} --docker_password=${{ secrets.DOCKERHUB_TOKEN }}
          version: "latest"

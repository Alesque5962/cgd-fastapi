[project]
name = "cgd-backend"
version = "0.1.0"
description = ""
authors = [{ name = "Alexandre Delétoille", email = "alexandre.deletoille@proton.me" }]
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
    "openai (>=1.77.0,<2.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "mistralai (>=1.9.3,<2.0.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
]

[tool.hatch.build.targets.sdist]
include = ["cgd_backend"]

[tool.hatch.build.targets.wheel]
include = ["cgd_backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

